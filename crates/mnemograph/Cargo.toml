[package]
name = "mnemograph"
description = "Self-hosted wiki and long-term memory for AI agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mnemograph-core.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
http = "1"
tower = "0.5"
thiserror = "2"
askama = "0.16"
askama_web = { version = "0.16", features = ["axum-0.8"] }
comrak = { version = "0.56", default-features = false }
percent-encoding = "2"
rand = "0.9"
base64 = "0.23.1"
sha2 = "0.10"
datastar = { version = "0.4", features = ["axum"] }
futures = "0.3"

[dev-dependencies]
rusqlite.workspace = true
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
sha2 = "0.10"
tempfile.workspace = true
