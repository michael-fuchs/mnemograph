# The spheres file for local development, in the format of the part of the central assistant
# configuration that mnemograph gets (version 1). In production this file is generated from the
# central configuration and mounted read-only; pass it with --spheres (MNEMOGRAPH_SPHERES).
#
# Each sphere is a table under `spheres`, named with lowercase letters, digits and -, starting
# with a letter, at most 32 characters. The name is what pages and notes carry and what an access
# token names in its scope `sphere:<name>`.
version = 1

[spheres.work]
description = "Employer, projects, colleagues"

[spheres.private]
description = "Family, home, finances"

# Read by every connection, changed only through its own: the owner's conventions, such as the
# page "Using mnemograph".
[spheres.meta]
description = "How the wiki itself is used"
rules = { readable_by = "all" }

# Sphere rules may follow each sphere:
# [spheres.private.rules]
# wiki = "allowed"   # or "never": the sphere's content must not enter the wiki; mnemograph
#                    # refuses to put anything new into it and connections made only of such
#                    # spheres
# llm = ["mistral"]  # the only LLM providers that may receive the sphere's content (not used
#                    # by mnemograph yet)
# readable_by = "own"  # or "all": every connection reads the sphere's content, but only
#                      # connections that have the sphere change it
