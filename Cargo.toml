[workspace]
resolver = "3"
members = ["crates/mnemograph-core", "crates/mnemograph"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/michael-fuchs/mnemograph"

[workspace.dependencies]
mnemograph-core = { path = "crates/mnemograph-core" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
rmcp = { version = "3.5", features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
